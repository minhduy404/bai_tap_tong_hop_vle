
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giới thiệu sản phẩm</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f2f4f8;
            font-family: Arial, sans-serif;
        }

        .product-card {
            width: 100%;
            max-width: 350px;
            margin: 50px auto;
            padding: 20px;
            border: 2px solid #ddd;
            border-radius: 15px;
            background-color: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        .product-card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 1px;
            border: 1px solid #eee;
            border-radius: 10px;
        }

        .product-name {
            margin-top: 20px;
            color: #222;
            font-weight: bold;
        }

        .product-price {
            margin: 15px 0;
            color: #dc3545;
            font-size: 24px;
            font-weight: bold;
        }

        .product-description {
            padding: 10px;
            color: #666;
            line-height: 1.6;
        }

        .buy-button {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #0d6efd;
            color: white;
            font-weight: bold;
            text-decoration: none;
        }

        .buy-button:hover {
            background-color: #084298;
        }
    </style>
</head>

<body>

<div class="container">
    <h2 class="text-center mt-4 fw-bold">SẢN PHẨM NỔI BẬT</h2>

    <div class="product-card">
        <img src="https://tse4.mm.bing.net/th/id/OIP.gWnxEkjPQLBI8D43-UoZRgAAAA?r=0&rs=1&pid=ImgDetMain&o=7&rm=3"
             alt="Máy ảnh">

        <h3 class="product-name">Máy ảnh Canon</h3>

        <p class="product-price">12.500.000 VNĐ</p>

        <p class="product-description">
            Máy ảnh chất lượng cao, thiết kế hiện đại,
            phù hợp cho học tập và sáng tạo nội dung.
        </p>

        <a href="#" class="buy-button">Mua ngay</a>
    </div>
</div>

</body>
</html>


<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Góp ý khách hàng</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f3f6fa;
            font-family: Arial, sans-serif;
        }

        .feedback-box {
            max-width: 750px;
            margin: 40px auto;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 15px;
            background-color: white;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .feedback-box h2 {
            margin-bottom: 10px;
            color: #198754;
            text-align: center;
            font-weight: bold;
        }

        .description {
            margin-bottom: 30px;
            color: #777;
            text-align: center;
        }

        .form-label {
            font-weight: bold;
        }

        .form-control,
        .form-select {
            padding: 11px;
        }

        .rating {
            padding: 15px;
            border-radius: 8px;
            background-color: #f8f9fa;
        }

        .submit-button {
            width: 100%;
            padding: 12px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="feedback-box">

        <h2>PHIẾU GÓP Ý</h2>

        <p class="description">
            Ý kiến của bạn giúp chúng tôi cải thiện chất lượng dịch vụ.
        </p>

        <form>

            <div class="row mb-3">

                <div class="col-md-6">
                    <label class="form-label">Họ và tên</label>
                    <input type="text" class="form-control"
                           placeholder="Nhập họ tên">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control"
                           placeholder="Nhập email">
                </div>

            </div>

            <div class="mb-3">
                <label class="form-label">Bạn muốn góp ý về vấn đề nào?</label>

                <select class="form-select">
                    <option selected>-- Chọn nội dung --</option>
                    <option>Chất lượng sản phẩm</option>
                    <option>Chất lượng dịch vụ</option>
                    <option>Giao diện website</option>
                    <option>Thái độ phục vụ</option>
                    <option>Khác</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Mức độ hài lòng</label>

                <div class="rating">

                    <div class="form-check">
                        <input type="radio" name="rating"
                               class="form-check-input" id="r1">
                        <label class="form-check-label" for="r1">
                            Rất hài lòng
                        </label>
                    </div>

                    <div class="form-check">
                        <input type="radio" name="rating"
                               class="form-check-input" id="r2">
                        <label class="form-check-label" for="r2">
                            Hài lòng
                        </label>
                    </div>

                    <div class="form-check">
                        <input type="radio" name="rating"
                               class="form-check-input" id="r3">
                        <label class="form-check-label" for="r3">
                            Bình thường
                        </label>
                    </div>

                    <div class="form-check">
                        <input type="radio" name="rating"
                               class="form-check-input" id="r4">
                        <label class="form-check-label" for="r4">
                            Không hài lòng
                        </label>
                    </div>

                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Nội dung góp ý</label>

                <textarea class="form-control" rows="5"
                          placeholder="Nhập ý kiến của bạn..."></textarea>
            </div>

            <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input"
                       id="reply">
                <label class="form-check-label" for="reply">
                    Tôi muốn nhận phản hồi qua email
                </label>
            </div>

            <div class="row">
                <div class="col-md-6 mb-2">
                    <button type="submit"
                            class="btn btn-success submit-button">
                        Gửi góp ý
                    </button>
                </div>

                <div class="col-md-6 mb-2">
                    <button type="reset"
                            class="btn btn-secondary submit-button">
                        Làm lại
                    </button>
                </div>
            </div>

        </form>

    </div>
</div>

</body>
</html>

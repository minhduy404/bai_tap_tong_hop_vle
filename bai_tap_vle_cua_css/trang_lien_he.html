
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f1f5f9;
            font-family: Arial, sans-serif;
        }

        .contact-box {
            margin: 50px auto;
            padding: 30px;
            border-radius: 15px;
            background-color: white;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .contact-title {
            margin-bottom: 25px;
            color: #0d6efd;
            font-weight: bold;
        }

        .contact-info {
            height: 100%;
            padding: 25px;
            border-radius: 10px;
            background-color: #0d6efd;
            color: white;
        }

        .contact-info h4 {
            margin-bottom: 25px;
        }

        .contact-info p {
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .form-control {
            padding: 12px;
        }

        .send-button {
            padding: 12px 30px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="contact-box">

        <h2 class="contact-title text-center">LIÊN HỆ VỚI CHÚNG TÔI</h2>

        <div class="row g-4">

            <div class="col-md-5">
                <div class="contact-info">
                    <h4>Thông tin liên hệ</h4>

                    <p><strong>Địa chỉ:</strong><br>
                        280 An Dương Vương, TP. Hồ Chí Minh
                    </p>

                    <p><strong>Email:</strong><br>
                        minhhduyy113@gmail.com
                    </p>

                    <p><strong>Điện thoại:</strong><br>
                        0384297604
                    </p>

                    <p><strong>Thời gian làm việc:</strong><br>
                        luôn mở 24/7
                    </p>
                </div>
            </div>

            <div class="col-md-7">

                <form>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Họ và tên</label>
                        <input type="text" class="form-control"
                               placeholder="Nhập họ tên">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Email</label>
                        <input type="email" class="form-control"
                               placeholder="Nhập email">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Tiêu đề</label>
                        <input type="text" class="form-control"
                               placeholder="Nhập tiêu đề">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Nội dung</label>
                        <textarea class="form-control" rows="5"
                                  placeholder="Nhập nội dung liên hệ"></textarea>
                    </div>

                    <button type="submit"
                            class="btn btn-primary send-button">
                        Gửi liên hệ
                    </button>

                    <button type="reset"
                            class="btn btn-outline-secondary send-button">
                        Xóa
                    </button>

                </form>

            </div>
        </div>
    </div>
</div>

</body>
</html>
